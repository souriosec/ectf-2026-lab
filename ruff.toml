target-version = "py312"
respect-gitignore = false
include = [".vscode/ctf.py", "analysis/**/*.py", "analysis/**/*.pyi", "tools/**/*.py", "tests/**/*.py"]
exclude = [".git", ".venv", "__pycache__", ".ruff_cache", ".ty_cache", ".runtime"]
extend-exclude = ["analysis/dashboard/upstream", "analysis/state", "analysis/runs", "analysis/backups"]

[lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM", "RUF"]
